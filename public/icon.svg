  <rect x="24" y="24" width="464" height="464" rx="80" fill="#EFEAE0" stroke="#C9BFA9" stroke-width="8"/>
  
  <!-- Marmita / Quentinha Central -->
  <rect x="96" y="140" width="320" height="240" rx="36" fill="#F7F3EA" stroke="#24211C" stroke-width="12"/>
  <line x1="96" y1="230" x2="416" y2="230" stroke="#A9744F" stroke-width="10" stroke-dasharray="16 12"/>
  
